<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0e1e">
<title>DUNE CHOPPA — moonrun</title>
<style>
  :root{ --sand:#d9cfa8; --glow:#ffc14d; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; background:#05070f; overflow:hidden;
    font-family:ui-monospace,Menlo,Consolas,monospace; color:#cdd6e0;
    user-select:none; -webkit-user-select:none; touch-action:none; }
  #wrap{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  canvas{ image-rendering:pixelated; image-rendering:crisp-edges;
    background:#05070f; box-shadow:0 0 60px rgba(255,180,80,.10), 0 0 140px rgba(80,120,255,.10);
    border-radius:4px; }
  #hint{ position:fixed; left:0; right:0; bottom:6px; text-align:center; font-size:11px;
    color:#5c6b7d; letter-spacing:.5px; pointer-events:none; }
  /* mobile controls */
  #touch{ position:fixed; inset:0; display:none; pointer-events:none; z-index:5; }
  .tbtn{ position:absolute; pointer-events:auto; display:flex; align-items:center; justify-content:center;
    border:1px solid rgba(217,207,168,.35); border-radius:50%; background:rgba(20,30,50,.35);
    color:rgba(217,207,168,.8); font-size:22px; width:74px; height:74px; }
  .tbtn:active{ background:rgba(255,193,77,.28); color:#ffc14d; }
  #tGo{ left:18px; bottom:22px; }
  #tBack{ left:104px; bottom:22px; }
  #tJump{ left:18px; bottom:104px; border-color:rgba(217,207,168,.5); font-size:18px; }
  #tUp{ right:104px; bottom:96px; }
  #tDown{ right:104px; bottom:22px; }
  #tFire{ right:18px; bottom:22px; border-color:rgba(255,120,80,.5); color:#ff9070; }
  #tNitro{ right:104px; bottom:170px; border-color:rgba(102,240,255,.5); color:#66f0ff; }
  @media (pointer:coarse){ #touch{ display:block; } #hint{ display:none; } }
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="480" height="270"></canvas></div>
<div id="touch">
  <div class="tbtn" id="tGo">▶</div>
  <div class="tbtn" id="tBack">◀</div>
  <div class="tbtn" id="tUp">▲</div>
  <div class="tbtn" id="tDown">▼</div>
  <div class="tbtn" id="tNitro">N</div>
  <div class="tbtn" id="tJump">JUMP</div>
  <div class="tbtn" id="tFire">✷</div>
</div>
<div id="hint">W throttle · S brake · A/D lean · SPACE jump · SHIFT nitro · MOUSE aim + FIRE · R restart</div>
<script src="game.js"></script>
</body>
</html>
