<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dunes — Rust/WASM/WebGPU terrain</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000;
    color: #eee; font: 14px/1.4 system-ui, sans-serif; }
  #msg { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; }
  canvas { display: block; }
</style>
<body>
  <div id="msg">loading dunes…</div>
  <script type="module">
    import init from "./pkg/dunes.js";
    if (!navigator.gpu) {
      document.getElementById("msg").textContent =
        "This demo needs WebGPU. Try a recent Chrome/Edge/Brave (or Safari 18+).";
    } else {
      init().then(() => {
        const m = document.getElementById("msg");
        if (m) m.remove();
      }).catch((e) => {
        document.getElementById("msg").textContent = "failed: " + e;
        console.error(e);
      });
    }
  </script>
</body>
